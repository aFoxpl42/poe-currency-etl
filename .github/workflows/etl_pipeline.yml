name: PoE Currency ETL Pipeline

on:
  # This allows you to click a button in GitHub to run it manually
  workflow_dispatch: 
  
  # This schedules the script to run daily at 08:00 UTC
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        env:
          # This securely pulls the connection string from your GitHub Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py